[project]
name = "island-evals"
version = "0.1.0"
description = "Evals for Life Island's guarded LLM features: server moderation, prompt invariants, public-surface claims, and live model behaviour."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Offline suites: the standard library plus pytest. No network, no API key.
dev = ["pytest>=8.3"]
# Live suites only (workflow_dispatch): the Anthropic SDK.
live = ["anthropic>=2.3,<3"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "offline: no network and no API key; runs on every push and PR (CI job offline-evals)",
    "live: calls the Anthropic API; runs only from the evals-live workflow with ANTHROPIC_API_KEY set",
]
