# Claims the 2026-11-02 copy pass rules out of public copy and NPC
# prompts. tests/test_public_claims.py scans every public surface with these,
# and tests/test_prompt_invariants.py scans every NPC system prompt.
#
# Each rule: `pattern` is a Python regex (`flags`: i = ignore case);
# `target` is "text" (visible text: tags stripped, entities decoded) or "raw"
# (hrefs and markup kept); `exempt_sentence` skips a match whose sentence also
# matches it (a guard like "Never say he graduated" names what it forbids);
# `surfaces` limits a rule to those files. Every `examples_bad` string must
# match and no `examples_ok` string may, so loosening a regex fails CI.

[[rule]]
id = "wrong-linkedin"
why = "The hiring CTA is linkedin.com/in/-abbas-ali; linkedin.com/in/digiscalability is the brand page."
pattern = 'linkedin\.com/in/(?!-abbas-ali(?![\w-]))[\w%-]+'
flags = "i"
target = "raw"
examples_bad = ["https://linkedin.com/in/digiscalability", "https://www.linkedin.com/in/abbas-ali-123"]
examples_ok = ["https://www.linkedin.com/in/-abbas-ali", "linkedin.com/in/-abbas-ali/", "LinkedIn"]

[[rule]]
id = "private-or-mirror-repo"
why = "Never link Rizz-Vii or the RankPilot repos (the private home or the public mirror)."
pattern = 'github\.com/(?:rizz-vii\b|digiscalability/rankpilot)'
flags = "i"
target = "raw"
examples_bad = ["https://github.com/Rizz-Vii/RankPilot", "github.com/digiscalability/rankpilot"]
examples_ok = ["https://github.com/digiscalability", "https://github.com/digiscalability/portfolio-island"]

[[rule]]
id = "phone-number"
why = "The phone number is never on the island or in the island repo."
pattern = '(?:\+61[\s.-]?|\b0)[23478](?:[\s.-]?\d){8}\b|\(0[2378]\)[\s.-]?\d{4}[\s.-]?\d{4}\b'
target = "raw"
examples_bad = ["+61 491 570 156", "0491 570 156", "+61491570156", "call (03) 5550 4567"]
examples_ok = ["Version 3.1.4", "2016 to 2017", "WORLD_RADIUS 100", "#0b1220", "1200x630"]

[[rule]]
id = "street-address"
why = "No street address anywhere public; the suburb is enough."
pattern = '\b\d{1,5}[A-Za-z]?\s+(?:[A-Z][a-z]+\s+){1,3}(?:Street|St|Road|Rd|Avenue|Ave|Parade|Pde|Drive|Dr|Court|Ct|Crescent|Cres|Lane|Ln|Place|Pl|Boulevard|Blvd|Highway|Hwy|Terrace|Tce)\b'
target = "text"
examples_bad = ["12 Main Street", "4/27 Example Road", "100 Sample Creek Highway"]
examples_ok = ["Mordialloc VIC 3195", "Spicer Street", "5 zones and 20 buildings"]

[[rule]]
id = "senior"
why = "Never use 'senior'."
pattern = '\bsenior\b'
flags = "i"
target = "text"
examples_bad = ["a senior engineer", "Senior AI Engineer"]
examples_ok = ["seniority", "AI & software engineer"]

[[rule]]
id = "team-or-agency"
why = "DigiScalability is one person: no 'team', 'our team', 'delivery team', 'growing teams' or 'agency'."
pattern = '\bteams?\b|\bagenc(?:y|ies)\b'
flags = "i"
target = "text"
examples_bad = ["our team", "a delivery team", "growing teams", "a Melbourne agency"]
examples_ok = ["teammate", "steam", "solo founder"]

[[rule]]
id = "business-we"
why = "Solo founder: the business never speaks as 'we'. Scoped to business copy; villagers may say 'we'."
pattern = '''\bwe(?:'re|\s+are|\s+build|\s+help|\s+deliver|\s+offer|\s+work\s+with|\s+speciali[sz]e)\b|\bour\s+(?:clients|customers|services|team|mission|agency|studio)\b'''
flags = "i"
target = "text"
surfaces = ["index.html", "public/hire.html", "public/llms.txt", "public/manifest.webmanifest", "api/z.js", "prompts"]
examples_bad = ["We build AI products", "we're a studio", "our clients"]
examples_ok = ["Abbas builds AI products", "were you there?", "our island"]

[[rule]]
id = "venture-studio"
why = "DigiScalability is one person; 'venture studio' pitches an organisation."
pattern = '\bventure\s+studios?\b'
flags = "i"
target = "text"
examples_bad = ["a Melbourne-based venture studio", "Venture Studio"]
examples_ok = ["Blender, DaVinci Resolve, ComfyUI: a full studio"]

[[rule]]
id = "unshipped-ai-claims"
why = "Interview probes that fail: RAG, LangChain, LangGraph, Genkit, MCP, and 'evals' until evals/ is merged with its offline CI job green. Lift 'evals' here in the change that first claims it on a public surface."
pattern = '\bRAG\b|\bMCP\b|(?i:\blang(?:chain|graph)\b|\bgenkit\b|\bevals?\b)'
target = "text"
examples_bad = ["built on RAG", "an MCP server", "LangChain agents", "Genkit flows", "with evals in CI"]
examples_ok = ["rag doll", "evaluate the race", "a guarded LLM feature"]

[[rule]]
id = "fabricated-proof"
why = "No client results, testimonials, 'production users', awards or partnerships."
pattern = '\btestimonials?\b|\bclient\s+results\b|\bproduction\s+users\b|\baward(?:s|ed|-winning)?\b|\bpartners?(?:hips?)?\b'
flags = "i"
target = "text"
examples_bad = ["client testimonials", "award-winning", "our partners", "a partnership with", "production users"]
examples_ok = ["a reward of five coins", "rewards", "the counterpart"]

[[rule]]
id = "retired-tagline"
why = "A retired line from earlier copy."
pattern = '\bday\s+job\s+in\s+tech\b'
flags = "i"
target = "text"
examples_bad = ["Day job in tech"]
examples_ok = ["a day of jobs"]

[[rule]]
id = "masters-status"
why = "Master of IT at Deakin: coursework, 11 of 16 credit points. Never 'nearly done' or 'graduated'."
pattern = '\b(?:nearly|almost)\s+(?:done|finished|complete[d]?)\b|(?:master\W?s|(?-i:\bMIT\b)|deakin)[^.\n]{0,80}?\bgraduat(?:ed|e|ing|ion)\b|\bgraduat(?:ed|e)\b[^.\n]{0,80}?(?:master\W?s|(?-i:\bMIT\b)|deakin)'
flags = "i"
target = "text"
exempt_sentence = '''\b(?:never|not)\b|n't\b'''
examples_bad = ["a Masters of IT nearly done", "MIT (Deakin) nearly done", "graduated from Deakin", "his Master's, graduated 2019"]
examples_ok = ["Never say he graduated from the Master's or that it is nearly done.", "11 of 16 credit points completed", "he has not graduated from the Master's", "graduated from SZABIST in 2016"]

[[rule]]
id = "grandmother"
why = "Bano's Cookbook is his mother's (Ammi's) handwritten recipes, never his grandmother's."
pattern = '\bgrandmother'
flags = "i"
target = "text"
examples_bad = ["a grandmother's handwritten recipes", "Grandmother"]
examples_ok = ["his mother's (Ammi's) handwritten recipes"]

[[rule]]
id = "frozen-since"
why = "The Insta Services API is being modernised; never 'frozen since'."
pattern = '\bfrozen\s+since\b'
flags = "i"
target = "text"
examples_bad = ["frozen since 2016"]
examples_ok = ["a frozen lake", "modernising an inherited 2016 Java system"]

[[rule]]
id = "rankpilot-users"
why = "RankPilot is live but pre-launch: no users beyond test accounts, so no user counts."
pattern = 'RankPilot[^.\n]{0,80}?\b\d[\d,.]*\s*[km+]?\s+(?:users|customers|clients|sign-?ups|subscribers)\b'
flags = "i"
target = "text"
examples_bad = ["RankPilot now serves 1,200 users", "RankPilot has 50+ customers"]
examples_ok = ["RankPilot (live, pre-launch: no users beyond test accounts)"]

[[rule]]
id = "rankpilot-daily-use"
why = "RankPilot is live but pre-launch, with no users beyond test accounts: never 'in daily use'. Not anchored to the name: both retired lines put a sentence or a line break between 'RankPilot' and the claim."
pattern = '\bin\s+daily\s+use\b'
flags = "i"
target = "text"
examples_bad = ["Solo build, live and in daily use.", "Solo build, in daily use.", "RankPilot is in daily use"]
examples_ok = ["RankPilot (live, pre-launch: no users beyond test accounts)", "the daily planner", "built for daily use"]

[[rule]]
id = "every-villager-ai"
why = "24 of the 28 villagers talk through Claude Haiku 4.5; the two Market Vendors, the First Mate and the Deckhand are scripted. Never 'every townsperson is a live AI agent', 'the townsfolk are live AI agents' or 'townspeople are live AI agents'. Villagers are LLM chat characters, never agents, counted or not ('24 villagers talk through Claude Haiku 4.5' is the approved line)."
pattern = '\bevery\s+(?:townsperson|villager|islander|resident|NPC)\b[^.!?]{0,60}?\bis\s+an?\s+(?:live\s+)?(?:AI|LLM)\b|(?<!\d\s)(?<!…\s)(?<!of\sthe\s)(?<!most\s)(?<!some\s)(?<!many\s)(?<!few\s)\b(?:townspeople|townsfolk|villagers|NPCs)\s+(?:here\s+|on\s+the\s+island\s+)?are\s+(?:all\s+)?(?:live\s+)?(?:AI|LLM)\b'
flags = "i"
target = "text"
examples_bad = [
  "every townsperson is a live AI agent",
  "every townsperson (including you) is a live AI agent",
  "Every townsperson on the island is a live LLM persona",
  "where every townsperson is a\n  live AI agent:",
  "every villager is an AI agent",
  "townspeople are live AI agents",
  "All the townspeople here are live AI agents",
  "The townsfolk are live AI agents — a planner sets their jobs",
  "The villagers are all live AI agents",
]
examples_ok = [
  "Each day you assign every townsperson a focus for the day",
  "24 villagers talk through Claude Haiku 4.5",
  "every townsperson has a daily job",
  "Live townsfolk are solid too",
]

[[rule]]
id = "villagers-are-agents"
why = "The agents are the planner and the analyst; the villagers are LLM chat characters."
pattern = '\b(?:townspeople|townsfolk|villagers|islanders|NPCs)\b[^.!?]{0,40}?\bare\s+(?:all\s+)?(?:live\s+)?(?:AI|LLM)\s+agents?\b'
flags = "i"
target = "text"
examples_bad = [
  "24 townspeople are live AI agents",
  "… of the townsfolk are live AI agents",
  "… villagers are live AI agents with a voice",
  "Most villagers are live AI agents",
]
examples_ok = ["24 villagers talk through Claude Haiku 4.5", "the planner and the analyst are agents"]

[[rule]]
id = "stale-npc-count"
why = "The cast is 24 LLM villagers out of 28 NPCs; the old '18 conversational agents' and '18 LLM NPCs' counts are stale."
pattern = '\b18\b[^.]{0,40}?\b(?:NPCs?|villagers?|agents?|townspeople|townsfolk|personas?)\b'
flags = "i"
target = "text"
examples_bad = ["Claude · 18 conversational agents", "18 conversational LLM NPCs", "all 18 villagers", "18\n  conversational LLM NPCs"]
examples_ok = ["24 villagers talk through Claude Haiku 4.5", "in 2018 the agents", "18 races. The villagers cheer", "the 18th villager"]
